server {
    # Cloud Run / Render port
    listen 8080;
    server_name _;

    # Root directory where Vite's compiled output is copied.
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for faster transfers.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    location / {
        # SPA fallback: if the file/directory doesn't exist, serve index.html.
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, fonts, KaTeX) aggressively in the browser.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security & Parent Embedding Headers
    # Allows Math Galaxy to be embedded cleanly inside the parent learning website
    add_header Content-Security-Policy "frame-ancestors *;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
